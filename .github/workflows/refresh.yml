name: Refresh data

on:
  schedule:
    # times are UTC. 11:00 UTC is 6am US Eastern during the season.
    - cron: '0 11 * * 2'   # Tuesday  - results in, new lines posted (the big one)
    - cron: '0 11 * * 4'   # Thursday - injury reports
    - cron: '0 11 * * 6'   # Saturday - late injury news
    - cron: '0 12 * * 0'   # Sunday   - final pre-kickoff refresh
    - cron: '0 6  * * 1'   # Monday   - Sunday results
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # completed seasons never change, so caching them keeps runs to ~1 minute
      - name: Cache nflverse downloads
        uses: actions/cache@v4
        with:
          path: cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Refresh
        id: refresh
        run: python refresh.py

      # only commit if something actually changed
      - name: Commit updated data
        run: |
          git config user.name  "read-option-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # a silent failure is worse than a loud one: open an issue if the run breaks
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled refresh failed. The site is still serving the last good data.\n\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })
