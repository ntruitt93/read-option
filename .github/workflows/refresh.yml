name: Refresh data

on:
  schedule:
    # All times UTC. Eastern is UTC-4 in season, UTC-5 after early November.
    # Daily 12:00 UTC (~8am ET) catches Thursday-night and Monday-night results.
    - cron: '0 12 * * *'
    # Sunday slate. Kickoffs are 1:00pm, 4:25pm and 8:20pm ET; a game takes
    # about 3h10m, so these land after each window closes:
    #   21:00 UTC = 5pm ET  after the 1pm games
    #   01:00 UTC = 9pm ET  after the 4:25pm games
    #   05:00 UTC = 1am ET  after the night game
    - cron: '0 21 * * 0'
    - cron: '0 1 * * 1'
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache nflverse downloads
        uses: actions/cache@v4
        with:
          path: cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Refresh
        run: python refresh.py --full

      - name: Commit updated data
        run: |
          git config user.name read-option-bot
          git config user.email actions@users.noreply.github.com
          git add data/
          git diff --staged --quiet || git commit -m 'data refresh'
          git push
