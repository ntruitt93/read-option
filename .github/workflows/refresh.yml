name: Refresh data

on:
  schedule:
    - cron: '0 11 * * 2'
    - cron: '0 11 * * 4'
    - cron: '0 11 * * 6'
    - cron: '0 12 * * 0'
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache nflverse downloads
        uses: actions/cache@v4
        with:
          path: cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Refresh
        run: python refresh.py

      - name: Commit updated data
        run: |
          git config user.name "read-option-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data refresh"
            git push
          fi
